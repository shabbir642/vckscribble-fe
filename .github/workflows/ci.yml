name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The contract and the seed word lists have their source of truth in the
      # backend repo, so CI checks those files out as a sibling. The repo is
      # public: the default token reads it, no secret needed.
      #
      # These checks run against the backend's main. When a change touches the
      # contract or the seeds, push the backend first and let its CI pass, then
      # push this repo; pushed the other way round, this run fails on drift.
      - uses: actions/checkout@v4
        with:
          repository: shabbir642/vckscribble-be
          ref: main
          path: be-src
          sparse-checkout: |
            src/contract
            src/db/packs.seed.ts
            src/db/words.seed.ts
          sparse-checkout-cone-mode: false

      # No version here: it comes from "packageManager" in package.json, and
      # the action fails outright when both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Fail if the vendored copies have drifted from the backend's. This is
      # what replaces the shared workspace package the repo split removed.
      - name: Contract drift check
        run: pnpm contract:check
        env:
          CONTRACT_SOURCE: be-src/src/contract/index.ts
      - name: Word list drift check
        run: pnpm words:check
        env:
          WORDS_SOURCE: be-src

      - run: pnpm typecheck
      # Built from the committed copies; the checks above are what guard them.
      - run: pnpm exec vite build
