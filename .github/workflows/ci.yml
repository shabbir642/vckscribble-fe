name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't appear in `if:` directly; this exposes only whether it exists.
      HAS_BE_TOKEN: ${{ secrets.BE_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # The contract's source of truth lives in the private backend repo, so CI
      # checks it out as a sibling. Needs a secret BE_REPO_TOKEN: a PAT (or
      # fine-grained token) with read access to vckscribble-be.
      - uses: actions/checkout@v4
        if: env.HAS_BE_TOKEN == 'true'
        with:
          repository: shabbir642/vckscribble-be
          token: ${{ secrets.BE_REPO_TOKEN }}
          path: be-src
          sparse-checkout: src/contract
          sparse-checkout-cone-mode: false

      # No version here: it comes from "packageManager" in package.json, and
      # the action fails outright when both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Fails if the vendored contract has drifted from the backend's copy.
      # This is what replaces the shared workspace package the repo split removed.
      - name: Contract drift check
        if: env.HAS_BE_TOKEN == 'true'
        run: pnpm contract:check
        env:
          CONTRACT_SOURCE: be-src/src/contract/index.ts
      - name: Contract drift check (skipped)
        if: env.HAS_BE_TOKEN != 'true'
        run: >-
          echo "::warning title=Contract drift check skipped::Add a BE_REPO_TOKEN
          secret (read access to vckscribble-be) to verify the vendored contract."

      - run: pnpm typecheck
      # Built from the committed contract; the check above is what guards it.
      - run: pnpm exec vite build
